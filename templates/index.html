<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ランニングフォーム解析アプリ</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f5f7fa; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🏃‍♂️ 走り方分析アプリ</h1>
        <p>動画をアップロードして解析を開始します</p>
        <form action="/analyze" method="POST" enctype="multipart/form-data">
            <input type="number" name="height_cm" value="165" style="width:95%; padding:10px; margin-bottom:20px;">
            <input type="file" name="videos" accept="video/*" multiple required style="margin-bottom:20px;">
            <button type="submit">解析を開始する</button>
        </form>
    </div>
</body>
</html>
